
name: Validação do Projeto

on:
  push:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Exibir informações
        run: |
          echo "Repositório: ${{ github.repository }}"
          echo "Usuário: ${{ github.actor }}"

      - name: Verificar README.md
        run: |
          if [ -f README.md ]; then
            echo "README.md encontrado!"
          else
            echo "ERRO: README.md não encontrado!"
            exit 1
          fi

      - name: Validação concluída
        run: echo "Validação do projeto concluída com sucesso!"
